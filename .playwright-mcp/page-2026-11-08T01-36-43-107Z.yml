          - region "Article content" [ref=f6e97]:
            - generic [ref=f6e98]:
              - generic [ref=f6e99]:
                - heading "Abstract" [level=2] [ref=f6e100]
                - paragraph [ref=f6e101]: Glycan arrays are indispensable for learning about the specificities of glycan-binding proteins. Despite the abundance of available data, the current analysis methods do not have the ability to interpret and use the variety of data types and to integrate information across datasets. Here we evaluated whether a novel, automated algorithm for glycan-array analysis could meet that need. We developed a regression-tree algorithm with simultaneous motif optimization and packaged it in software called MotifFinder. We applied the software to data from 8 different glycan-array platforms with widely divergent characteristics and observed an accurate analysis of each dataset. We then evaluated the feasibility and value of the combined analyses of multiple datasets. In an integrated analysis of datasets covering multiple lectin concentrations, the software determined approximate binding constants for distinct motifs and identified major differences between the motifs that were not apparent from single-concentration analyses. Furthermore, an integrated analysis of data sources with complementary sets of glycans produced broader views of lectin specificity than produced by the analysis of just one data source. MotifFinder therefore enables the optimal use of the expanding resource of glycan-array data and promises to advance the studies of protein-glycan interactions.
              - generic [ref=f6e102]:
                - heading "Introduction" [level=2] [ref=f6e103]
                - paragraph [ref=f6e104]:
                  - text: Lectins are powerful tools for the study of glycans. All cells in every organism produce proteins that engage oligosaccharide ligands. Such proteins, known as lectins, can initiate, modulate, and carry out an array of functions, for example cell-cell communication, anti-microbial defense, cellular trafficking, or membrane organization
                  - superscript [ref=f6e105]:
                    - link "1" [ref=f6e106] [cursor=pointer]:
                      - /url: "#R1"
                    - text: –
                    - link "2" [ref=f6e107] [cursor=pointer]:
                      - /url: "#R2"
                  - text: . The specificity of a lectin for specific arrangements of oligosaccharides is central to its biological function and to its value in research. If the specificity of a lectin or glycan-binding antibody is well understood, researchers can use the protein to localize and measure the corresponding glycans in biological specimens.
                - paragraph [ref=f6e108]:
                  - text: Characterizing the binding preferences of a lectin or glycan-binding antibody (collectively termed glycan-binding proteins, GBPs) is not simple. In the early studies, lectin binding was described in terms of monosaccharides, such as N-acetyl-galactosamine or galactose
                  - superscript [ref=f6e109]:
                    - link "3" [ref=f6e110] [cursor=pointer]:
                      - /url: "#R3"
                  - text: . As chemists began to produce higher-order structures that better approximated the various features in biology, the studies showed a far higher degree of complexity than previously appreciated. It was revealed that most lectins bind not just one glycan substructure, but rather a family of substructures, all related in some way
                  - superscript [ref=f6e111]:
                    - link "4" [ref=f6e112] [cursor=pointer]:
                      - /url: "#R4"
                  - text: . The strength of binding within the family depends on secondary features like the surrounding monosaccharides that are not directly in the binding pocket or the particular selection of monosaccharides that are tolerated within the pocket
                  - superscript [ref=f6e113]:
                    - link "5" [ref=f6e114] [cursor=pointer]:
                      - /url: "#R5"
                  - text: . The ability to view this complexity depends on the experimental capabilities of synthesizing the complex structures and testing the binding to each one.
                - paragraph [ref=f6e115]:
                  - text: Fortunately, new synthesis strategies have resulted in the production of an increasing diversity of higher-complexity structures. The new structures include various types of sialylated structures
                  - superscript [ref=f6e116]:
                    - link "6" [ref=f6e117] [cursor=pointer]:
                      - /url: "#R6"
                    - text: –
                    - link "8" [ref=f6e118] [cursor=pointer]:
                      - /url: "#R8"
                  - text: ", human milk oligosaccharides"
                  - superscript [ref=f6e119]:
                    - link "9" [ref=f6e120] [cursor=pointer]:
                      - /url: "#R9"
                  - text: ", asymmetrically-branched N-glycans"
                  - superscript [ref=f6e121]:
                    - link "10" [ref=f6e122] [cursor=pointer]:
                      - /url: "#R10"
                    - text: –
                    - link "11" [ref=f6e123] [cursor=pointer]:
                      - /url: "#R11"
                  - text: . In addition, microarrays have been developed to cover additional classes of glycans, including arrays of microbial glycans
                  - superscript [ref=f6e124]:
                    - link "12" [ref=f6e125] [cursor=pointer]:
                      - /url: "#R12"
                  - text: ", plant cell-wall glycans"
                  - superscript [ref=f6e126]:
                    - link "13" [ref=f6e127] [cursor=pointer]:
                      - /url: "#R13"
                  - text: ", and fully-defined heparan sulfate glycans"
                  - superscript [ref=f6e128]:
                    - link "14" [ref=f6e129] [cursor=pointer]:
                      - /url: "#R14"
                  - text: . New experimental systems for glycan presentation and detection include a glycan bead array
                  - superscript [ref=f6e130]:
                    - link "15" [ref=f6e131] [cursor=pointer]:
                      - /url: "#R15"
                  - text: ", a Next-Generation Glycan Microarray (NGGM)"
                  - superscript [ref=f6e132]:
                    - link "16" [ref=f6e133] [cursor=pointer]:
                      - /url: "#R16"
                  - text: ", and a Competitive Universal Proxy Receptor Assay (CUPRA)"
                  - superscript [ref=f6e134]:
                    - link "17" [ref=f6e135] [cursor=pointer]:
                      - /url: "#R17"
                  - text: . These new technologies offer the potential to identify complex interactions such as multivalent and hetero-multivalent interactions (binding to multiple identical or different ligands, respectively)
                  - superscript [ref=f6e136]:
                    - link "18" [ref=f6e137] [cursor=pointer]:
                      - /url: "#R18"
                  - text: .
                - paragraph [ref=f6e138]:
                  - text: Bioinformatics tools are required to handle this increasing complexity and diversity of data. At the introduction of glycan microarrays, structure-alignment methods were developed for analyzing patterns in glycans
                  - superscript [ref=f6e139]:
                    - link "19" [ref=f6e140] [cursor=pointer]:
                      - /url: "#R19"
                  - text: . Pattern analysis applied specifically to glycan-array data appeared with a motif-based approach
                  - superscript [ref=f6e141]:
                    - link "20" [ref=f6e142] [cursor=pointer]:
                      - /url: "#R20"
                  - text: ", followed by subtree mining methods"
                  - superscript [ref=f6e143]:
                    - link "21" [ref=f6e144] [cursor=pointer]:
                      - /url: "#R21"
                  - text: ", a quantitative structure-activity relationship (QSAR) method"
                  - superscript [ref=f6e145]:
                    - link "22" [ref=f6e146] [cursor=pointer]:
                      - /url: "#R22"
                  - text: ", an advanced structure alignment method for multiple carbohydrate alignment with weights (MCAW)"
                  - superscript [ref=f6e147]:
                    - link "23" [ref=f6e148] [cursor=pointer]:
                      - /url: "#R23"
                  - text: ", and an advanced motif-based method that we introduced"
                  - superscript [ref=f6e149]:
                    - link "24" [ref=f6e150] [cursor=pointer]:
                      - /url: "#R24"
                  - text: . A recent, promising algorithm is carbohydrate classification accounting for restricted linkages (CCARL)
                  - superscript [ref=f6e151]:
                    - link "25" [ref=f6e152] [cursor=pointer]:
                      - /url: "#R25"
                  - text: . Software to make the methods accessible to non-bioinformaticians include GlycoPattern
                  - superscript [ref=f6e153]:
                    - link "26" [ref=f6e154] [cursor=pointer]:
                      - /url: "#R26"
                  - text: ", Glycan Miner"
                  - superscript [ref=f6e155]:
                    - link "27" [ref=f6e156] [cursor=pointer]:
                      - /url: "#R27"
                  - text: ", the MCAW database"
                  - superscript [ref=f6e157]:
                    - link "28" [ref=f6e158] [cursor=pointer]:
                      - /url: "#R28"
                  - text: ", the Glycan Array Dashboard (GLAD)"
                  - superscript [ref=f6e159]:
                    - link "29" [ref=f6e160] [cursor=pointer]:
                      - /url: "#R29"
                  - text: ", and the Glycan Microarray Database (GlyMDB)"
                  - superscript [ref=f6e161]:
                    - link "30" [ref=f6e162] [cursor=pointer]:
                      - /url: "#R30"
                  - text: .
                - paragraph [ref=f6e163]: While the above methods provided valuable advances in glycan-array analysis, they offer limited ability to fully explore the expanding depth and variety of data. In particular, the current software options are not easily adaptable to diverse glycan-array platforms, and they do not allow for the combined analysis of multiple datasets. Thus, we sought to develop the ability to use and integrate information from multiple data platforms. Further, we aimed at a system that users could directly run without intervention, which is necessary for increasing productivity, reducing bias, and broadening the range of researchers who could use the method.
              - generic [ref=f6e164]:
                - heading "Experimental Section" [level=2] [ref=f6e165]
                - generic [ref=f6e166]:
                  - heading "Software" [level=3] [ref=f6e167]
                  - paragraph [ref=f6e168]:
                    - text: The MotifFinder software was developed using Matlab R2017a and R Version 3.5.0. The analyses presented here used the latest beta branch of MotifFinder version 2.2.4. MotifFinder utilizes the DrawGlycan-SNFG tool for rendering glycan and motif structures
                    - superscript [ref=f6e169]:
                      - link "31" [ref=f6e170] [cursor=pointer]:
                        - /url: "#R31"
                    - text: . Details on the use of MotifFinder, including screenshots and step-by-step instructions for all procedures used here, are available in the User’s Manual distributed with all release versions of MotifFinder. Slight adaptions were made to CCARL to run on a Window’s 10 operating system and to adapt to a continuous-fit model for the cross-validation analysis.
                - generic [ref=f6e171]:
                  - heading "Data Preparation" [level=3] [ref=f6e172]
                  - paragraph [ref=f6e173]:
                    - text: Data were retrieved from various sources (
                    - link "Table S2" [ref=f6e174] [cursor=pointer]:
                      - /url: "#SD2"
                    - text: ). The input of MotifFinder is comma-delimited text (Excel/CSV) with columns for the ID, name, intensity, and, optionally, standard deviation associated with each glycan. The glycan name is the simplified IUPAC format used in CFG data. Data from non-CFG sources required modest reformatting. Data from the CUPRA array, which is provide as a depletion index (DI), was inverted (1 – DI) to fit MotifFinder’s expectation of a positive correlation between binding and the quantification metric. The structural-grafting data were given numerical values of 1 to indicate binders and 0 to indicate nonbinders. The results from the GlyMDB and MCAW-DB databases were retrieved from their respective websites.
                - generic [ref=f6e175]:
                  - heading "Cross-Validation Analysis of Model Accuracy in 22 Datasets" [level=3] [ref=f6e176]
                  - paragraph [ref=f6e177]:
                    - text: The 22 datasets used for cross-validation analyses matched those in Coff
                    - emphasis [ref=f6e178]: et. al
                    - text: .
                    - superscript [ref=f6e179]:
                      - link "25" [ref=f6e180] [cursor=pointer]:
                        - /url: "#R25"
                    - text: ", with the addition of datasets for ECL and DSA. Each dataset was split into 5 folds (4/5 of the glycans for training and 1/5 for testing) using a built-in function in MotifFinder. The default parameters were used for the MotifFinder models. The CCARL models were converted from classification to continuous prediction by substituting lasso-regularized logistic regression with a regression-tree algorithm, using the Sklearn package in python. The regression trees used a cross-validation-selected tree depth without the added motif-optimization features of MotifFinder. The model from each training set was used to predict binding to each glycan in the test set ("
                    - link "Supporting Methods" [ref=f6e181] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), and for each prediction, R
                    - superscript [ref=f6e182]: "2"
                    - text: was calculated by comparing predicted to actual binding.
                - generic [ref=f6e183]:
                  - heading "Graphics and Figure Preparation" [level=3] [ref=f6e184]
                  - paragraph [ref=f6e185]: Plots were made using Matlab R2017a and R 3.5.0 using the ggplot2 package. The figures were prepared using Deneba Canvas X and Canvas Draw 5.
                - generic [ref=f6e186]:
                  - heading "Statistics" [level=3] [ref=f6e187]
                  - paragraph [ref=f6e188]:
                    - text: The accuracy of prediction fit was calculated as the , where
                    - emphasis [ref=f6e189]: prediction error
                    - text: = Σ(
                    - emphasis [ref=f6e190]: fitted value
                    - text: −
                    - emphasis [ref=f6e191]: observed value
                    - text: )
                    - superscript [ref=f6e192]: "2"
                    - text: and
                    - emphasis [ref=f6e193]: total error
                    - text: = Σ(
                    - emphasis [ref=f6e194]: mean value
                    - text: −
                    - emphasis [ref=f6e195]: observed value
                    - text: )
                    - superscript [ref=f6e196]: "2"
                    - text: . Differences between groups of test-set fits were tested using a paired t-test with unequal variances.
              - generic [ref=f6e197]:
                - heading "Results" [level=2] [ref=f6e198]
                - generic [ref=f6e199]:
                  - heading "Identification of Complex Binding Determinants" [level=3] [ref=f6e200]
                  - paragraph [ref=f6e201]:
                    - text: We developed an algorithm to extract the complex specificities of glycan-binding proteins from glycan-array data. We previously reported the algorithm’s theoretical basis
                    - superscript [ref=f6e202]:
                      - link "32" [ref=f6e203] [cursor=pointer]:
                        - /url: "#R32"
                    - text: ", but we had not applied the method to the combined analysis of diverse glycan-array data. The algorithm uses a previously developed syntax for motifs"
                    - superscript [ref=f6e204]:
                      - link "24" [ref=f6e205] [cursor=pointer]:
                        - /url: "#R24"
                    - text: that allows for variability in multiple components of the motif (
                    - link "Figure 1A" [ref=f6e206] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ). A new approach for using the motifs, developed for this study, is to represent the specificity of a GBP as two tiers of motifs (
                    - link "Figure 1B" [ref=f6e207] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ). The first tier is the primary motifs, which are the main determinants of binding, and the second tier is the fine specificities, which are modifications to the primary motifs that influence binding. Motif features outside of the glycan proper, such as density, linker composition, and polypeptide sequence, also could affect binding but were not covered in the current version of the syntax.
                  - figure [ref=f6e208]:
                    - heading "Figure 1. Automated Mining of Complex Specificities." [level=4] [ref=f6e209]
                    - paragraph [ref=f6e210]:
                      - img "Figure 1." [ref=f6e211]
                    - link "Open in a new tab" [ref=f6e213] [cursor=pointer]:
                      - /url: figure/F1/
                    - paragraph [ref=f6e215]: A. Versatile syntax for individual motifs. The syntax allows for the explicit definition of variability in multiple aspects of the structure, which enables the description of motifs of almost any complexity. B. Two-layer family of motifs. The specificity of a glycan-binding protein is represented as a family of motifs. The first layer is the primary motifs, and the second layer is the fine specificities. C. Regression-tree modeling. MotifFinder uses repeated splitting of the data to identify the primary motifs (A and B) and the fine specificities (A1 and A*).
                  - paragraph [ref=f6e216]:
                    - text: The algorithm uses regression-tree modeling to uncover the two-tiered family of motifs representing a GBP’s specificity. The algorithm splits the data repeatedly to optimize the separation of the data into groups with distinct binding (
                    - link "Figure 1C" [ref=f6e217] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ), and it concurrently produces new motifs to further optimize the accuracy of the splits. The optimization of the motifs is performed by testing all versions and incrementally growing the ones with the best ability to improve the accuracy of the splits. In this way, the initial splits give the primary motifs (motifs A and B,
                    - link "Figure 1C" [ref=f6e218] [cursor=pointer]:
                      - /url: "#F1"
                    - text: ), and the secondary splits give the fine specificities (motif A1, with the remainder of a primary motif denoted as A*).
                  - paragraph [ref=f6e219]:
                    - text: In a test set of lectins that covers a wide range of protein folds, source organisms, and primary binding determinants, the analyses demonstrated useful insights into the nuances of lectin specificities (
                    - link "Figure S1" [ref=f6e220] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). For example, a comparison between the jacalin lectin and PNA, which have similar primary motifs but different fine specificities, correctly found the main primary motif of terminal Galβ1–3GalNAc for both lectins as well as fine specificities that agree with previous research. For example, jacalin had been found to bind Galβ1–3GalNAc when attached directly to a polypeptide backbone or as a disaccharide
                    - superscript [ref=f6e221]:
                      - link "33" [ref=f6e222] [cursor=pointer]:
                        - /url: "#R33"
                    - text: and PNA was found to permit binding when the reducing end is extended
                    - superscript [ref=f6e223]:
                      - link "3" [ref=f6e224] [cursor=pointer]:
                        - /url: "#R3"
                    - text: . For DSA, the results exactly replicated previous findings
                    - superscript [ref=f6e225]:
                      - link "34" [ref=f6e226] [cursor=pointer]:
                        - /url: "#R34"
                    - text: by identifying ranked preferences for LacNAc attached 6’ to Man, short chains of β1–4 linked GlcNAc (chitin), and poly-LacNAc, and they added information by identifying a preference for LacNAc in the context of a tetra-antennary N-glycan over LacNAc only on the 6’ branch. The unambiguous syntax also provided greater clarity than qualitative descriptions. For example, MotifFinder gave precise definitions of the canonical specificities of MAL-II as di-sialylated core 1 O-GalNAc and its sulfated variants (motif A1 and the fine specificities of motif B), motifs that are frequently misinterpreted due to confused definitions of specificity
                    - superscript [ref=f6e227]:
                      - link "35" [ref=f6e228] [cursor=pointer]:
                        - /url: "#R35"
                    - text: . Further, the algorithm added information by identifying binding to the mono-sialylated forms of core 1 O-GalNAc and differences between the variants of the 3’ sulfated epitopes.
                - generic [ref=f6e229]:
                  - heading "Analysis of Data from Divergent Platforms" [level=3] [ref=f6e230]
                  - paragraph [ref=f6e231]: A prerequisite for the integration of diverse data was the seamless processing of data from any glycan array. To this end, we used a parser for the glycan names that allows the input of any data in which the glycan names are in text. We required only an association of each glycan with a quantity that is indicative of binding. We tested data from platforms with differences between them in types of glycans, methods of data acquisition, and modes of quantification. For each dataset, we asked whether the program returned results that concorded with the known specificities and manual analyses, and whether it provided insights into the fine specificities.
                  - paragraph [ref=f6e232]:
                    - text: A source with similarities to the CFG in the types of glycans was the glycan bead array
                    - superscript [ref=f6e233]:
                      - link "15" [ref=f6e234] [cursor=pointer]:
                        - /url: "#R15"
                    - text: . MotifFinder analyzed these data without any modification. In the analysis of PNA (
                    - link "Figure 2A" [ref=f6e235] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ), the algorithm found Galβ1–3GalNAc (Motif A) as the top determinant, in agreement with previous information. Relative to the CFG array (
                    - link "Figure S1" [ref=f6e236] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ), the bead-array analysis gave fewer fine specificities, but it identified evidence of weak binding to Lewis A epitopes (motif B) and uncommon glycans with a terminal alpha-linkage (Motif C). A source with a completely different set of glycans is a microbial-glycan array
                    - superscript [ref=f6e237]:
                      - link "12" [ref=f6e238] [cursor=pointer]:
                        - /url: "#R12"
                    - text: . This array includes non-mammalian monosaccharides such as xylose, arabinose, or N-acetyl-fucosamine, as well as oligosaccharide sequences not seen in mammalian glycans. MotifFinder parsed the majority of the glycans (126/141) in a dataset for the bacterial
                    - emphasis [ref=f6e240]: Burkholderia cenocepacia
                    - text: lectin (BC2L-A), and it correctly identified binding to glycans containing L-glycero D-manno-heptose (LDmanHep)
                    - superscript [ref=f6e241]:
                      - link "36" [ref=f6e242] [cursor=pointer]:
                        - /url: "#R36"
                    - text: (Motifs B-B2,
                    - link "Figure 2B" [ref=f6e243] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). The MotifFinder analysis of this lectin on the CFG array identified only high-mannose glycans (
                    - link "Figure S2" [ref=f6e244] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) owing to the absence of LDmanHep-containing glycans on the CFG array.
                  - figure [ref=f6e245]:
                    - heading "Figure 2. Analysis of Data from Divergent Platforms." [level=4] [ref=f6e246]
                    - paragraph [ref=f6e247]:
                      - img "Figure 2." [ref=f6e248]
                    - link "Open in a new tab" [ref=f6e250] [cursor=pointer]:
                      - /url: figure/F2/
                    - paragraph [ref=f6e252]: The graphs show the intensities of binding to the glycans grouped according to their motifs, which are presented graphically at right. The units of binding vary between the methods. A. The bead array uses mean fluorescence intensity (MFI). B. The microbial array uses relative fluorescence units (RFU). C. Structure grafting denotes compatible and incompatible glycans respectively with a 1 or 0.
                  - paragraph [ref=f6e253]:
                    - text: Finally, we tested the method on semi-quantitative data. The glycan-grafting method developed by Grant
                    - emphasis [ref=f6e254]: et al
                    - text: . integrates protein structure into glycan binding consideration
                    - superscript [ref=f6e255]:
                      - link "37" [ref=f6e256] [cursor=pointer]:
                        - /url: "#R37"
                    - text: and categorically reports whether a glycan could or could not be grafted. We assigned glycans a value of 1 or 0 to indicate success or failure of grafting, respectively. The MotifFinder analysis of Ricin B-Chain (PDB 2AAI) indicated tolerance for a wide variety of galactose-containing glycans, including certain 2’ fucosylated or 3’ and 6’ sialylated structures (motif A,
                    - link "Figure 2C" [ref=f6e257] [cursor=pointer]:
                      - /url: "#F2"
                    - text: ). This broad tolerance contrasts with the stricter specificity of RCA-I, which has high sequence similarity to Ricin B-Chain. In any case, the result demonstrates a method to objectively analyze grafting data and to compare it with results from glycan arrays.
                  - paragraph [ref=f6e258]:
                    - text: As further testing on diverse platforms, we applied MotifFinder to the CUPRA array, the NGGM array, the neoglycoprotein array, a plant cell-wall array, and an asymmetric N-glycan array (
                    - link "Figure S3" [ref=f6e259] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). In each case, the results matched the manually determined specificities and were supported by analyses of the same lectins on the CFG array (
                    - link "Figure S2" [ref=f6e260] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Thus, MotifFinder readily analyzed data from a wide diversity of platforms.
                - generic [ref=f6e261]:
                  - heading "Integrated Analysis of Datasets with Varying Lectin Concentrations" [level=3] [ref=f6e262]
                  - paragraph [ref=f6e263]:
                    - text: The automated capabilities of this system opened the potential for an integrated analysis of lectin binding over multiple concentrations. To explore this possibility, we developed a function to analyze logistic regression fits of motif binding across protein concentrations (
                    - link "Supporting Methods" [ref=f6e264] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "Figure 3A" [ref=f6e265] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ). We evaluated whether the analysis could provide information about binding preferences that could not be derived using single-concentration analyses.
                  - figure [ref=f6e266]:
                    - heading "Figure 3. Combined Analysis of Datasets with Varied Protein Concentrations." [level=4] [ref=f6e267]
                    - paragraph [ref=f6e268]:
                      - img "Figure 3." [ref=f6e269]
                    - link "Open in a new tab" [ref=f6e271] [cursor=pointer]:
                      - /url: figure/F3/
                    - paragraph [ref=f6e273]:
                      - text: A. The fit of the logistic curve across concentrations provides the asymptote, slope, and half-maximum binding for each motif, the latter approximating the K
                      - subscript [ref=f6e274]: d
                      - text: . B. The simultaneous analysis of data for PNA over multiple concentrations gave the average binding to each motif at each concentration. C. The logistic curves fit to the average binding for each motif revealed distinct binding profiles across motifs. D. The relative binding (motif binding normalized to the highest motif binding) was plotted with respect to the curve-derived K
                      - subscript [ref=f6e275]: d
                      - text: values.
                  - paragraph [ref=f6e276]:
                    - text: We used CFG data for PNA across four lectin concentrations (0.1, 1, 10, and 100 μg/mL). The analysis gave estimates of motif binding at each concentration (
                    - link "Figure 3B" [ref=f6e277] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ) and produced logistic curves with a wide range of binding parameters across the motifs (
                    - link "Figure 3C" [ref=f6e278] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ). These calculations enabled a comparison of the apparent K
                    - subscript [ref=f6e279]: d
                    - text: values derived across all concentrations with the relative-binding values derived from each single concentration (
                    - link "Figure 3D" [ref=f6e280] [cursor=pointer]:
                      - /url: "#F3"
                    - text: ). For some motifs, the rank order was significantly different. For example, motifs A2 and A11 had relatively weak binding at all concentrations yet had strong (numerically low) apparent K
                    - subscript [ref=f6e281]: d
                    - text: values. Other motifs such as A5, A6, and B1 showed strong relative binding at higher concentrations but weak apparent K
                    - subscript [ref=f6e282]: d
                    - text: values, making them likely to have overestimated relative binding in higher-concentration datasets.
                  - paragraph [ref=f6e283]:
                    - text: The divergence between apparent K
                    - subscript [ref=f6e284]: d
                    - text: and relative binding could stem from experimental sources, such as differences between the glycans in their densities on the surface or their accessibility to lectins when immobilized. Alternatively, the divergence could stem from fundamental kinetics, such as differences between the motifs in their association and disassociation rates. Motifs A2 and A11, which have lower apparent K
                    - subscript [ref=f6e285]: d
                    - text: values, have sialic acid near the canonical epitope of Galβ1,3GalNAc, while Motifs A5 and A6, which have much higher apparent K
                    - subscript [ref=f6e286]: d
                    - text: values, have an extended branch neighboring the shorter Galβ1,3GalNAc. The extended branch could potentially weaken the interaction (increasing the dissociation rate). The kinetics cannot be directly measured with conventional microarray technology, but within the limits of the experiment, this analysis demonstrates the importance of an integrated analysis across lectin concentrations. The derivation of approximate binding constants could provide more accurate identifications of the strong and weak motifs than would be possible at any single concentration.
                - generic [ref=f6e287]:
                  - heading "Integrating Data from Diverse Arrays for a Single Lectin" [level=3] [ref=f6e288]
                  - paragraph [ref=f6e289]:
                    - text: Another application opened up by this system is the combined analysis of arrays with complementary glycans. Because the universe of glycans is so vast, and because each array contains only a particular subset of glycans, no single data source could provide a complete picture of specificity. We explored the value of joining information across arrays using data for the
                    - emphasis [ref=f6e290]: Ricinus communis
                    - text: agglutinin I (RCA-I) collected over 7 different arrays (
                    - link "Table S2" [ref=f6e291] [cursor=pointer]:
                      - /url: "#SD2"
                    - text: ). To place the datasets in similar ranges and scales, we used post-model mapping and motif curve fitting (
                    - link "Supporting Methods" [ref=f6e292] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "Figure S4" [ref=f6e293] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). Based on the assumption that independent datasets should show basic agreement to build a coherent model, we selected datasets that optimized the generalization of a model from a training set (4/5 of the sets) to a test set (1/5 of the sets) (
                    - link "Supporting Methods" [ref=f6e294] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). This process selected the CFG array, the NCFG data (the latest CFG array content and an ASN-linked N-glycan array), an array of asymmetrically extended N-glycans
                    - superscript [ref=f6e295]:
                      - link "5" [ref=f6e296] [cursor=pointer]:
                        - /url: "#R5"
                    - text: ", and an array of neoglycoproteins"
                    - superscript [ref=f6e297]:
                      - link "38" [ref=f6e298] [cursor=pointer]:
                        - /url: "#R38"
                    - text: . Datasets excluded from training a combined analysis model were reserved for model validation (
                    - link "Figure S4" [ref=f6e299] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                  - paragraph [ref=f6e300]:
                    - text: We compared the results obtained using only the CFG data (
                    - link "Figure 4A" [ref=f6e301] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ) to the results obtained using multiple data sources (
                    - link "Figure 4B" [ref=f6e302] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). Both analyses found that terminal LacNAc (Galβ1–4GlcNAc) was required, and that 6’ substitutions on the Gal are tolerated. Whereas the single-source model found biantennary LacNAc as the top motif (Motif A3,
                    - link "Figure 4A" [ref=f6e303] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ), the mixed-source model found terminal poly-LacNAc as the strongest motif (Motifs A8 and A9,
                    - link "Figure 4B" [ref=f6e304] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). The mixed-source model also found that bi-antennary, terminal LacNAc binds markedly better than mono-antennary LacNAc (Motifs A and B,
                    - link "Figure 4B" [ref=f6e305] [cursor=pointer]:
                      - /url: "#F4"
                    - text: ). The additional information was provided mainly from the monoantennary glycans in the asymmetric N-glycan array and the neoglycoprotein array.
                  - figure [ref=f6e306]:
                    - heading "Figure 4. Integration of Data from Mixed Datasets for RCA-I." [level=4] [ref=f6e307]
                    - paragraph [ref=f6e308]:
                      - img "Figure 4." [ref=f6e309]
                    - link "Open in a new tab" [ref=f6e311] [cursor=pointer]:
                      - /url: figure/F4/
                    - paragraph [ref=f6e313]: A. The single-source analysis of datasets from the CFG gave six primary motifs and 15 fine specificities. B. The integrated analysis of datasets from five different platforms revealed features not found in the single-source analysis, such as terminal poly-LacNAc (motifs A8, A9, and A7).
                  - paragraph [ref=f6e314]:
                    - text: As a further evaluation, we compared the abilities of the models to predict the levels of lectin binding to independent sets glycans (
                    - link "Supporting Methods" [ref=f6e315] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: and
                    - link "Figure S4" [ref=f6e316] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ). In the application of a model trained only on CFG data (single source) and a model trained on multiple sources (mixed source) to the glycans in the CFG data, the R
                    - superscript [ref=f6e317]: "2"
                    - text: fits between predicted and actual binding were similar. But when applied to glycans from all 5 sources used in the mixed-source model or from 5 additional sources used in neither model, the R
                    - superscript [ref=f6e318]: "2"
                    - text: fits were significantly higher using the mixed-source model. This result supports the conclusion of increased accuracy in defining lectin specificity using integrated information from diverse sources.
                - generic [ref=f6e319]:
                  - heading "Comparisons of Output Between Analysis Tools" [level=3] [ref=f6e320]
                  - paragraph [ref=f6e321]:
                    - text: We next assessed the output of MotifFinder by comparing it to the output from other programs. We used CFG-array data for the
                    - emphasis [ref=f6e322]: Erythrina cristagalli
                    - text: lectin (ECL) for this purpose. Two databases, GlyMDB and MCAW-DB, had pre-analyzed results for the data, and the programs MotifFinder and CCARL provided fresh analyses. These analysis tools have appeared in publications in the last 5 years and are still supported by their developers. We did not include older tools that are no longer supported by the developers. To enable objective comparisons of the methods, we examined the overall fit of the glycans between predicted and actual binding (
                    - link "Supporting Methods" [ref=f6e323] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ).
                  - paragraph [ref=f6e324]:
                    - text: ECL binds type-2 LacNAc (Galβ1–4GlcNAc), especially in multivalent presentations
                    - superscript [ref=f6e325]:
                      - link "39" [ref=f6e326] [cursor=pointer]:
                        - /url: "#R39"
                    - text: . It lacks tolerance for 6’ galactose substitutions but allows 2’ galactose substitutions such as found in H-antigen (blood group O)
                    - superscript [ref=f6e327]:
                      - link "40" [ref=f6e328] [cursor=pointer]:
                        - /url: "#R40"
                      - text: –
                      - link "41" [ref=f6e329] [cursor=pointer]:
                        - /url: "#R41"
                    - text: . The motifs given by the two databases were able to correctly identify many high binding glycans but GlyMDB lacked specificity while MCAW-DB lacked sensitivity. GlyMDB (
                    - link "Figure 5A" [ref=f6e330] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ) uses subtree motifs that lack the ability to specify substitution intolerance (carbons that must be unsubstituted for a glycan to contain the motif). MCAW-DB (
                    - link "Figure 5B" [ref=f6e331] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ) uses an alignment-based method to identify the structure in common for the highest binding glycans but gives little information regarding less strongly bound glycans. CCARL (
                    - link "Fig. 5C" [ref=f6e332] [cursor=pointer]:
                      - /url: "#F5"
                    - text: ) is similar to GlyMDB in the use of subtree modeling, but on account of the use of “restricted nodes” that define substitution intolerance, it gave a superior R
                    - superscript [ref=f6e333]: "2"
                    - text: of 0.32. MotifFinder, in contrast, identified features associated with each degree of binding. Binding was highest to Galβ1–4GlcNAc on two separate branches (Motif A), less to the same feature on a single branch (Motif B), and weak to GalNAcβ1–4GlcNAc (Motif C) or Fucα1–2Galβ1–4GlcNAc (Motif D). Accordingly, the R
                    - superscript [ref=f6e334]: "2"
                    - text: of 0.75 was over double that of the next highest, MCAW-DB. Thus, all of methods found the main motif of Galβ1–4GlcNAc, but only MotifFinder identified all of the canonical binding motifs (
                    - link "Figure S5" [ref=f6e335] [cursor=pointer]:
                      - /url: "#SD1"
                    - text: ) and their associations with gradations in binding.
                  - figure [ref=f6e336]:
                    - heading "Figure 5. Comparisons of Analysis Tools." [level=4] [ref=f6e337]
                    - paragraph [ref=f6e338]:
                      - img "Figure 5." [ref=f6e339]
                    - link "Open in a new tab" [ref=f6e341] [cursor=pointer]:
                      - /url: figure/F5/
                    - paragraph [ref=f6e343]:
                      - text: Each tool was evaluated using a CFG dataset for the lectin ECL. The plots present the ECL binding to the glycans organized by the motifs found by each method. A. GlyMDB. B. MCAW-DB. C. CCARL. D. MotifFinder. The R
                      - superscript [ref=f6e344]: "2"
                      - text: values were calculated using the observed binding compared to predicted binding.
                  - paragraph [ref=f6e345]:
                    - text: We further evaluated MotifFinder and CCARL by cross-validation. Using datasets from 22 lectins, we derived a specificity model from 4/5 of the glycans in each dataset and used the model to predict binding to the remaining 1/5 of the glycans, with iteration over the five splits. The average R
                    - superscript [ref=f6e346]: "2"
                    - text: over all splits and lectins was 0.4 and 0.37 using multiple or single lectin concentrations with MotifFinder, respectively, and 0.27 using CCARL (
                    - link "Table S2" [ref=f6e347] [cursor=pointer]:
                      - /url: "#SD2"
                    - text: ). The values using MotifFinder were higher in 19/22 datasets.
              - generic [ref=f6e348]:
                - heading "Discussion" [level=2] [ref=f6e349]
                - paragraph [ref=f6e350]: The potential value of glycan-array data is increasing. More and more groups produce arrays, and the arrays have greater variety in the glycans. In order to make full use of this resource, researchers need software that can process information from a wide mix of array types and that can integrate information in the combined analysis of multiple datasets. In this work, we present a system to address this need. We used a powerful glycan-name parser with a versatile syntax for motifs to input data from any source, and we developed a decision-tree algorithm with built-in motif optimization to derive the specificities of glycan-binding proteins. We demonstrated the ability to 1) seamlessly analyze data from any glycan-array platform; and 2) perform integrated analyses of multiple datasets. These capabilities are without precedent among methods to analyze glycan-array data.
                - paragraph [ref=f6e351]:
                  - text: A useful application of the integrated analysis is to identify concentration-dependent changes in apparent lectin binding. Previous analyses were manual and focused on individual glycans rather than motifs. Here we demonstrate a software tool that calculates apparent binding parameters for individual motifs. By evaluating binding to the motifs that are common between the glycans, the approach reflects the way in which lectins actually bind. The analysis presented here revealed that certain features in the motifs bound by PNA could link to differences between the motifs in apparent K
                  - subscript [ref=f6e352]: d
                  - text: . Future research could test the hypotheses that neighboring sialic acids reduce dissociation rates and that extended branches increase dissociation rates of PNA binding. The limitations to the analysis are that the separate concentrations must be run under highly controlled, consistent conditions, and that the concentrations should provide enough range and data to enable accurate curves.
                - paragraph [ref=f6e353]:
                  - text: The second application of integrated analysis, to combine information from disparate arrays, showed the potential for obtaining more complete views of specificity. It is clear that no single array can provide enough content to give full information about specificity. Data from complementary arrays could help to meet this need, but without software to combine the analyses, researchers could gather only limited insights. In the present demonstration, the integration of arrays containing motifs not in the CFG array led to useful insights into differential binding between branched glycans, extended monoantennary glycans, and short monoantennary glycans. A limitation of the approach is that at least a subset of the strong-to-moderately bound glycans should overlap between the datasets. In the present analysis, we excluded the microbial array because of poor overlap with the other arrays. Another limitation is that the datasets should have similar lectin concentrations in order to minimize concentration-dependent differences. Finally, the platforms should not have many inherent differences in the types of glycans that are bound. Such differences are not predictable but occasionally occur
                  - superscript [ref=f6e354]:
                    - link "42" [ref=f6e355] [cursor=pointer]:
                      - /url: "#R42"
                  - text: . Here, we excluded the glycan bead array and the NGGM datasets from training owing to low agreement with the rest of the datasets. The apparent difference in specificity may be due to the novel microarray formats used for those datasets.
                - paragraph [ref=f6e356]:
                  - text: An important implication of this work relates to the use of lectins and glycan-binding antibodies as probes for their targets in biological samples. In such studies, the interpretation is typically based on simplified information about the GBP specificities. But given the complexities of the specificities, simple interpretations may not be accurate. To provide higher accuracy, an algorithm that makes use of the output from glycan-array analyses could prove useful. We previously introduced an algorithm for this purpose
                  - superscript [ref=f6e357]:
                    - link "43" [ref=f6e358] [cursor=pointer]:
                      - /url: "#R43"
                  - text: ", in which we convert the measurements of lectin binding into estimates of the motifs in the sample. Using a similar algorithm, one could predict the binding of a lectin to a previously untested glycan, which could be useful for the design of synthetic glycans."
                - paragraph [ref=f6e359]:
                  - text: The current study also suggested important areas for further development. Going forward, analyses could address the fact that other features beyond the motifs used here could influence lectin binding. For example, the microbial glycan array contains glycans with atypical substitutions that are not monosaccharides or common chemical modifiers, such as pyruvates or phosphoamino-pentanol. In other cases, the linker attaching the glycan to the substrate could have significant effects on binding
                  - superscript [ref=f6e360]:
                    - link "38" [ref=f6e361] [cursor=pointer]:
                      - /url: "#R38"
                  - text: ", as in single amino acids resulting in weaker binding due to steric hindrance"
                  - superscript [ref=f6e362]:
                    - link "44" [ref=f6e363] [cursor=pointer]:
                      - /url: "#R44"
                  - text: . Other factors include the sequence of the polypeptide backbone and the density of glycosylation, which could be studied using polypeptide arrays
                  - superscript [ref=f6e364]:
                    - link "45" [ref=f6e365] [cursor=pointer]:
                      - /url: "#R45"
                  - text: and density-variant arrays
                  - superscript [ref=f6e366]:
                    - link "46" [ref=f6e367] [cursor=pointer]:
                      - /url: "#R46"
                    - text: –
                    - link "47" [ref=f6e368] [cursor=pointer]:
                      - /url: "#R47"
                  - text: . New analyses also could accommodate glycans that do not have fully defined sequences. An array with such glycans is the natural (shotgun) microarray, derived from cell or tissue sources
                  - superscript [ref=f6e369]:
                    - link "5" [ref=f6e370] [cursor=pointer]:
                      - /url: "#R5"
                    - text: ","
                    - link "48" [ref=f6e371] [cursor=pointer]:
                      - /url: "#R48"
                  - text: . The framework of the motif syntax used here would support buildout to accommodate these features.
              - generic [ref=f6e372]:
                - heading "Conclusions" [level=2] [ref=f6e373]
                - paragraph [ref=f6e374]: Among the various tools currently available for analyzing glycan-array data, the ability to integrate information across arrays and platforms is unique to MotifFinder. The need for such a tool is ever greater, given the expansion and diversification of glycan-array platforms. The ability to run the analysis without intervention by the user and the readily interpretable output make the method accessible to researchers who are not experts in glycobiology or bioinformatics. Thus, an increased number of researchers could analyze data from diverse arrays and leverage the unique advantages of each individual array.
