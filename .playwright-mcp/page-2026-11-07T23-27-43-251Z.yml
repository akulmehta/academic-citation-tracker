        - generic [ref=f169e234]:
          - generic [ref=f169e236]:
            - heading "Abstract" [level=2] [ref=f169e237]
            - generic [ref=f169e238]: "The knowledge of weaving pattern design has spread to almost all regions in Thailand since prehistoric. The ethnic pattern design may vary based on ideology, beliefs, and traditions of people in each region. Until this day, the original weaving pattern may change by the adaptation of local textile designer and the Cross-cultural environment. Thus, the study of Thai weaving pattern design is necessary for reserving Thai ethnic wisdom of textile design. This work aims to develop the data dashboard by collecting Thai weaving pattern images from Google based on the information from the Royal Thai Silk Conservation Village Project, the Office of Sericulture Conservation and Standard Conformity Assessment, the Queen Sirikit Department of Sericulture, Ministry of Agriculture and Cooperatives. Our image gallery of Thai weaving patterns consists of 28 patterns from 4 regions: 1) The weaving patterns of northern Thailand include Jok Mae Jam, Jok Maueng Long, Yok Mook Lab Lae, Yok Dok Lamphun silk, and Sin Maueng Nan; 2) The weaving patterns of northeastern Thailand include Hol, Hang Kra Rok, Amprom, La Buek, Sin Tiew, Saked silk, Kaab Bua, Mud Mee Chonnabot silk, Luk Kaew patterned ebony-dyed silk, Mud Mee Teen Dang, Mud Mee Kaew Mookda silk, Mud Mee Kor Naree silk, Praewa silk, Mud Mee Soi Dok Mak silk, Samor, Anloonseem, and Kid; 3) The weaving patterns of central Thailand include Thai-Yuan Yok Mook and Thai-Yuan Jok; The weaving patterns of southern Thailand include Chuan Tani, Pum Riang silk, Yok Maueng Nakhon, and Na Muen Si. Our system can show the useful information of Thai weaving pattern such as the location on the map, the philosopher who gave the detail of weaving pattern, the weaving pattern design, and the textile techniques."
